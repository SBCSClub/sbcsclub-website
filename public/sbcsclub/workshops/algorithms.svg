<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Circle -->
  <circle cx="100" cy="100" r="94" fill="#0d1829" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Cyan Orbital Arcs -->
  <path d="M 28 115 A 80 80 0 0 1 155 45" fill="none" stroke="url(#orbitGrad1)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 172 85 A 80 80 0 0 1 45 155" fill="none" stroke="url(#orbitGrad2)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- White Laptop Base -->
  <path d="M 38 126 C 38 124 40 122 43 122 L 157 122 C 160 122 162 124 162 126 C 162 128 160 130 157 130 L 43 130 C 40 130 38 128 38 126 Z" fill="#ffffff"/>
  <rect x="80" y="122" width="40" height="3" rx="1.5" fill="#0d1829"/>

  <!-- Laptop Screen Outer Outline -->
  <rect x="50" y="62" width="100" height="60" rx="6" fill="#0d1829" stroke="#ffffff" stroke-width="4.5"/>

  <!-- Binary Tree Inside Screen -->
  <!-- Tree Edges -->
  <line x1="100" y1="78" x2="80" y2="92" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="78" x2="120" y2="92" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="92" x2="70" y2="108" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="92" x2="90" y2="108" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="92" x2="110" y2="108" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="92" x2="130" y2="108" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Tree Nodes (Circles) -->
  <!-- Level 0 (Root) -->
  <circle cx="100" cy="78" r="5.5" fill="#0d1829" stroke="#ffffff" stroke-width="3.5"/>
  <!-- Level 1 -->
  <circle cx="80" cy="92" r="5" fill="#0d1829" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="120" cy="92" r="5" fill="#0d1829" stroke="#ffffff" stroke-width="3.5"/>
  <!-- Level 2 (Leaves) -->
  <circle cx="70" cy="108" r="4.5" fill="#0d1829" stroke="#ffffff" stroke-width="3"/>
  <circle cx="90" cy="108" r="4.5" fill="#0d1829" stroke="#ffffff" stroke-width="3"/>
  <circle cx="110" cy="108" r="4.5" fill="#0d1829" stroke="#ffffff" stroke-width="3"/>
  <circle cx="130" cy="108" r="4.5" fill="#0d1829" stroke="#ffffff" stroke-width="3"/>
</svg>
